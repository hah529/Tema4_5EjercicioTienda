<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tienda</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 0 20px; }
        form { display: flex; flex-direction: column; gap: 10px; background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
        input, button { padding: 10px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; }
        button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #218838; }
        ul { list-style-type: none; padding: 0; }
        .del { background:#dc3545; padding:4px 8px; margin-left:8px; }
        .del:hover { background:#bb2d3b; }
        li { background: #fff; border: 1px solid #ddd; margin-bottom: 8px; padding: 12px; border-radius: 4px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<h2>Añadir Nuevo Producto</h2>
<form id="form-producto">
    <input type="text" id="sku" placeholder="SKU (ej: SKU-006)" required>
    <input type="text" id="nombre" placeholder="Nombre del producto" required>
    <input type="number" step="0.01" id="precio" placeholder="Precio (€)" required>
    <input type="number" id="stock" placeholder="Cantidad en Stock" required>
    <select id="categoria" required style="padding:10px;font-size:14px;border-radius:4px;border:1px solid #ccc;">
        <option value="">Cargando categorías...</option>
    </select>
    <button type="submit">Guardar Producto</button>
</form>

<h2>Productos Disponibles</h2>
<button type="button" onclick="cargarProductos()" style="background-color: #007bff;">Actualizar Lista</button>
<ul id="lista-productos"></ul>

<script>
    // Debe coincidir con api.path + api.version de application.properties
    const BASE_URL = '/api/v3';
    const API_URL = BASE_URL + '/productos';
    const CATEGORIAS_URL = BASE_URL + '/categorias';

    const esc = (t) => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    // Extrae un mensaje legible de la respuesta de error de Spring
    async function mensajeError(respuesta) {
        try {
            const e = await respuesta.json();
            if (e.errors && e.errors.length) {
                return e.errors.map(x => x.defaultMessage || x.message).join('\n');
            }
            return e.message || e.error || ('Error ' + respuesta.status);
        } catch {
            return 'Error ' + respuesta.status;
        }
    }

    async function cargarCategorias() {
        const select = document.getElementById('categoria');
        try {
            const respuesta = await fetch(CATEGORIAS_URL);
            if (!respuesta.ok) throw new Error('Error al obtener categorías');
            const categorias = await respuesta.json();
            select.innerHTML = '<option value="">Selecciona categoría</option>' +
                categorias.map(c => `<option value="${esc(c.nombre)}">${esc(c.nombre)}</option>`).join('');
        } catch (error) {
            console.error('Error:', error);
            select.innerHTML = '<option value="">No se pudieron cargar</option>';
        }
    }

    async function cargarProductos() {
        try {
            const respuesta = await fetch(API_URL);
            if (!respuesta.ok) throw new Error('Error al obtener productos');

            const productos = await respuesta.json();
            const lista = document.getElementById('lista-productos');
            lista.innerHTML = '';

            productos.forEach(p => {
                const li = document.createElement('li');
                li.innerHTML = `<span><strong>${esc(p.nombre)}</strong> (${esc(p.sku)}) - ${esc(p.precio)}€ · ${esc(p.categoria)}</span>
                    <span>Stock: ${esc(p.stock)}<button type="button" class="del" onclick="borrarProducto(${Number(p.id)})">X</button></span>`;
                lista.appendChild(li);
            });
        } catch (error) {
            console.error('Error:', error);
        }
    }

    async function borrarProducto(id) {
        if (!confirm('¿Borrar el producto?')) return;
        try {
            const respuesta = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            if (respuesta.ok) cargarProductos();
            else alert(await mensajeError(respuesta));
        } catch {
            alert('No se pudo conectar con el servidor.');
        }
    }

    // POST: el DTO ProductoCreateRequest recibe la categoría por NOMBRE
    document.getElementById('form-producto').addEventListener('submit', async (e) => {
        e.preventDefault();

        const nuevoProducto = {
            sku: document.getElementById('sku').value.trim(),
            nombre: document.getElementById('nombre').value.trim(),
            precio: parseFloat(document.getElementById('precio').value),
            stock: parseInt(document.getElementById('stock').value),
            categoria: document.getElementById('categoria').value
        };

        try {
            const respuesta = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevoProducto)
            });

            if (respuesta.ok) {
                alert('¡Producto creado con éxito!');
                document.getElementById('form-producto').reset();
                cargarProductos();
            } else {
                alert(await mensajeError(respuesta));
            }
        } catch (error) {
            alert('No se pudo conectar con el servidor.');
        }
    });

    cargarCategorias();
    cargarProductos();
</script>
</body>
</html>
